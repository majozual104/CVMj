<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 380" width="100%" height="100%">
  <defs>
    <linearGradient id="p3Bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#fff5f7" />
      <stop offset="100%" stop-color="#fce8ed" />
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="600" height="380" rx="16" fill="url(#p3Bg)" />

  <!-- Browser Chrome Window -->
  <rect x="25" y="25" width="550" height="330" rx="12" fill="#ffffff" stroke="#f0dfe3" stroke-width="1.5" />
  
  <!-- Header Bar -->
  <rect x="25" y="25" width="550" height="38" rx="12" fill="#fdf2f4" />
  <circle cx="48" cy="44" r="5" fill="#f7b5c4" />
  <circle cx="64" cy="44" r="5" fill="#facbd5" />
  <circle cx="80" cy="44" r="5" fill="#d95376" opacity="0.4" />
  <rect x="105" y="34" width="310" height="20" rx="6" fill="#ffffff" stroke="#f0dfe3" />
  <text x="120" y="48" font-family="sans-serif" font-size="11" fill="#98858d">arcsa-erp.gob.ec / pruebas-y-documentacion</text>

  <!-- Flowchart & Process Diagrams (Bizagi / Visio Representation) -->
  <rect x="45" y="75" width="510" height="150" rx="10" fill="#fff9fa" stroke="#faedf0" />
  <text x="65" y="100" font-family="sans-serif" font-size="12" font-weight="bold" fill="#2d2226">Flujograma de Procesos y Casos de Uso (Sistema ERP)</text>

  <!-- Node 1: Inicio -->
  <rect x="65" y="125" width="95" height="40" rx="20" fill="#d95376" />
  <text x="112" y="150" font-family="sans-serif" font-size="10" font-weight="bold" fill="#ffffff" text-anchor="middle">Inicio / Trámite</text>

  <!-- Arrow 1 -->
  <line x1="160" y1="145" x2="195" y2="145" stroke="#d95376" stroke-width="2" />
  <polygon points="195,141 202,145 195,149" fill="#d95376" />

  <!-- Node 2: Validación -->
  <polygon points="250,120 295,145 250,170 205,145" fill="#ffffff" stroke="#e88299" stroke-width="2" />
  <text x="250" y="148" font-family="sans-serif" font-size="9" font-weight="bold" fill="#2d2226" text-anchor="middle">Validación ERP</text>

  <!-- Arrow 2 -->
  <line x1="295" y1="145" x2="335" y2="145" stroke="#d95376" stroke-width="2" />
  <polygon points="335,141 342,145 335,149" fill="#d95376" />

  <!-- Node 3: QA Testing -->
  <rect x="345" y="125" width="105" height="40" rx="6" fill="#fdeef1" stroke="#d95376" stroke-width="1.5" />
  <text x="397" y="143" font-family="sans-serif" font-size="10" font-weight="bold" fill="#d95376" text-anchor="middle">Matriz de Prueba</text>
  <text x="397" y="156" font-family="sans-serif" font-size="8" fill="#6e5e64" text-anchor="middle">Postman / Manual</text>

  <!-- Arrow 3 -->
  <line x1="450" y1="145" x2="480" y2="145" stroke="#d95376" stroke-width="2" />
  <polygon points="480,141 487,145 480,149" fill="#d95376" />

  <!-- Node 4: Manuales de Usuario -->
  <rect x="490" y="125" width="55" height="40" rx="6" fill="#e88299" />
  <text x="517" y="143" font-family="sans-serif" font-size="9" font-weight="bold" fill="#ffffff" text-anchor="middle">Manual</text>
  <text x="517" y="156" font-family="sans-serif" font-size="8" fill="#ffffff" text-anchor="middle">Público</text>

  <!-- Bottom Section: Testing Metrics & Training Cards -->
  <rect x="45" y="240" width="245" height="95" rx="8" fill="#ffffff" stroke="#f0dfe3" />
  <text x="60" y="265" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2d2226">Matrices de Evidencia</text>
  <text x="60" y="285" font-family="sans-serif" font-size="10" fill="#6e5e64">Casos funcionales aprobados: 100%</text>
  <rect x="60" y="295" width="215" height="12" rx="6" fill="#faedf0" />
  <rect x="60" y="295" width="215" height="12" rx="6" fill="#d95376" />

  <rect x="305" y="240" width="250" height="95" rx="8" fill="#ffffff" stroke="#f0dfe3" />
  <text x="320" y="265" font-family="sans-serif" font-size="11" font-weight="bold" fill="#2d2226">Capacitaciones a Colaboradores</text>
  <text x="320" y="285" font-family="sans-serif" font-size="10" fill="#6e5e64">Guías de uso, flujos y asistencia directa</text>
  <rect x="320" y="300" width="80" height="20" rx="10" fill="#fdeef1" />
  <text x="360" y="313" font-family="sans-serif" font-size="9" font-weight="bold" fill="#d95376" text-anchor="middle">Completado</text>
</svg>
